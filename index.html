<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body {

            background-color: rgb(30, 30, 88);


        }

        .tasks-table {
            background-color: antiquewhite;
            width: 60%;

            margin-top: 130px;
        }


        .task {
            display: flex;
            background-color: white;
            padding: 6px;
            border-bottom: solid black 1px;
            transition: box-shadow 0.2s;
        }

        .done {
            background-color: rgb(158, 253, 160);


        }

        .task:hover {
            box-shadow: 0px 3px 15px rgba(97, 97, 97, 0.843);

        }

        button {

            border: none;
            font-size: 20px;
            box-shadow: 0px 3px 5px rgba(168, 168, 168, 0.38);

        }

        .circ {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            line-height: 0px;
        }
    </style>




</head>

<body>
    <div>
        <!-- CENTER DIV -->
        <div style="display: flex; justify-content: center; align-items: center">
            <!-- TASKS TABLE -->
            <div class="tasks-table">
                <!-- HEADER -->
                <div
                    style="width: 100%; text-align: center; background: rgb(200, 70, 70); color: white; padding-top: 8px;padding-bottom: 8px;">
                    <h1 style="display: inline;"> The Tasks</h1>

                    <button id="btn-add" class="circ"
                        style="float: right; background: white; margin-right: 10px; padding-bottom: 4px;">
                        <span class="material-symbols-outlined">
                            add
                        </span>
                    </button>
                </div>

                <!-- TASKS -->
                <div id="tasks" style="padding: 20px;">
                    <!-- task -->
                    <div class="task">
                        <!--Task INFO  -->
                        <div style="width: 70%;">
                            <h2>Read a book</h2>

                            <div>
                                <span class="material-symbols-outlined">
                                    calendar_month
                                </span>
                                <span>
                                    13/11/2026
                                </span>
                            </div>
                        </div>

                        <!-- Task Action -->
                        <div style="display: flex; justify-content:  space-between; align-items: center; width: 20%; ">
                            <button class="circ" style="background-color: brown; color: white;"><span
                                    class="material-symbols-outlined">
                                    delete
                                </span>
                            </button>
                            <button class="circ" style="background-color: rgb(42, 165, 48); color: white;">
                                <span class="material-symbols-outlined">
                                    done
                                </span>
                            </button>
                            <button class="circ" style="background-color: rgb(42, 63, 165); color: white;"><span
                                    class="material-symbols-outlined">
                                    edit
                                </span></button>

                        </div>

                    </div>

                </div>
            </div>



        </div>
    </div>

</body>

<script>


    let tasks = [
        {

            "title": "Read a book",
            "date": "13/11/2026",
            "isdone": true

        },
        {

            "title": "go to gym",
            "date": "13/11/2026",
            "isdone": false

        },
        {

            "title": "studying",
            "date": "13/11/2026",
            "isdone": false

        }


    ]
    function gettasks() {
        let retrivetasks = JSON.parse(localStorage.getItem("tasks"))
        if (retrivetasks == null) {
            tasks = []
        }
        else {
            tasks = retrivetasks
        }

    }
    gettasks()


    function filltasksonpage() {


        document.getElementById("tasks").innerHTML = ""

        let index = 0
        for (task of tasks) {
            let content =
                `
            <div class="task ${task.isdone ? 'done' : ''}">
                        <!--Task INFO  -->
                <div style="width: 70%;">
                            <h2>${task.title}</h2>

                            <div>
                                <span class="material-symbols-outlined">
                                    calendar_month
                                    </span>
                                    <span> 
                                        ${task.date}   
                                </span>
                            </div>
                </div>

                        <!-- Task Action -->
                        <div style="display: flex; justify-content:  space-between; align-items: center; width: 20%; ">
                            <button onclick="deletetask(${index})" class="circ" style="background-color: brown; color: white;"><span
                                    class="material-symbols-outlined">
                                    delete
                                </span>
                            </button>
                            
                            ${task.isdone ? `
                             <button onclick="completetask(${index})" class="circ" style="background-color: rgb(218, 70, 66); color: white;">
                                <span class="material-symbols-outlined">
                                    cancel
                                </span>
                            </button>
                              
                            ` : `
                            
                             <button onclick="completetask(${index})" class="circ" style="background-color: rgb(42, 165, 48); color: white;">
                                <span class="material-symbols-outlined">
                                    done
                                </span>
                            </button>
                            `}
                           
                            <button onclick="edittask(${index})" class="circ" style="background-color: rgb(42, 63, 165); color: white;"><span
                                    class="material-symbols-outlined">
                                    edit
                                </span></button>

                        </div>

            </div>

                
         `

            document.getElementById("tasks").innerHTML += content
            index++

        }
    }

    filltasksonpage()

    document.getElementById("btn-add").addEventListener("click", function () {

        let taskname = prompt(" Please ,enter Your schedule ")
        let taskobj = {

            "title": taskname,
            "date": new Date().toLocaleDateString("en-GB"),
            "isdone": false
        }

        tasks.push(taskobj)
        storetasks()
        filltasksonpage()
    })

    function deletetask(index) {
        let task = tasks[index]
        let isconfirmed = confirm(`Are you sure you want delete ${task.title}`)
        if (isconfirmed) {
            tasks.splice(index, 1)
            storetasks()
            filltasksonpage()
        }

    }


    function edittask(index) {

        let newtasktitle = prompt("Enter The alternative task")
        let task = tasks[index]
        task.title = newtasktitle
        storetasks()
        filltasksonpage()
    }

    function completetask(index) {
        let task = tasks[index]

        task.isdone = !task.isdone
        storetasks()
        filltasksonpage()



    }
    function storetasks() {

        let taskstring = JSON.stringify(tasks)
        localStorage.setItem("tasks", taskstring)
    }






</script>


</html>
